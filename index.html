<title>Would Kraymes Rather</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: schermata VS a due pannelli con taglio diagonale. Due schieramenti (blu a sinistra, rosso a destra), tutto il resto in neutri freddi. */
:root{
  --bg:#E7EAEF; --surface:#F4F6F9; --fg:#12141A; --muted:#566070; --line:#C5CBD6;
  --p1:#C8261D; --p2:#1D55C9; --on-p:#FFFFFF;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --cut:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1016; --surface:#171A23; --fg:#ECEEF3; --muted:#8F99AB; --line:#2A3040;
    --p1:#CF2F25; --p2:#2F66DB; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1016; --surface:#171A23; --fg:#ECEEF3; --muted:#8F99AB; --line:#2A3040;
  --p1:#CF2F25; --p2:#2F66DB; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px 56px;
}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,7vw,4rem);line-height:.92;text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.stats{display:flex;gap:20px;font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{display:block;font-family:var(--display);font-size:2rem;line-height:1;font-weight:800;color:var(--fg);letter-spacing:.01em}




.ninp{width:100%;min-width:0;font:inherit;font-weight:600;padding:8px 10px;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:0}
.ninp:focus-visible{outline:3px solid var(--fg);outline-offset:2px;border-color:var(--fg)}
.ninp:disabled{opacity:.45;cursor:not-allowed}
.names{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.names .ninp{padding:6px 6px;font-size:.78rem}
.csel{font:inherit;font-size:.78rem;font-weight:600;padding:3px 6px;max-width:92%;background:var(--bg);color:var(--fg);border:0;border-radius:0}
.csel:focus-visible,.cb:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cseg{display:flex;align-items:stretch;min-height:38px;gap:0;border:2px solid currentColor;width:100%;max-width:100%;min-width:0}
.cb{flex:1 1 0;min-width:0;border:0;background:transparent;color:inherit;font-family:var(--mono);font-size:.64rem;letter-spacing:.02em;text-transform:uppercase;padding:5px 3px;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center}
.tile.cat .cb{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.02em;padding:4px 2px;line-height:1.05}
.cstack{display:flex;flex-direction:column;gap:4px;width:100%}
.cstack .cseg{min-height:26px}
.cb + .cb{border-left:2px solid currentColor}
.cb.on{background:var(--on-p);color:var(--p1)}
.tile.cat:not(:has(input:checked)) .cb.on{background:var(--fg);color:var(--bg)}
/* Kr4ymes Quiz */
.sel{width:100%;appearance:auto;font:inherit;font-weight:600;padding:9px 10px;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:0}
.sel:focus-visible{outline:3px solid var(--fg);outline-offset:2px;border-color:var(--fg)}
.prow2{display:grid;grid-template-columns:9rem 1fr;align-items:center;gap:12px}
.prow2 .pn{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;min-width:6.5rem}
.lvls{display:flex;flex-direction:column;gap:6px}
.lvls .tile{padding:10px 4px}
.lvls .tt{font-size:.82rem;letter-spacing:0}
.seg.c5{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.seg.c5 .tile{padding:10px 2px}
.seg.c5 .tt{font-size:.74rem;letter-spacing:0;overflow-wrap:anywhere}
.qbig{font-family:var(--display);font-weight:900;font-size:3.2rem;line-height:1;text-align:center}
.qbig small{display:block;font-family:var(--mono);font-weight:400;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.rng{width:100%;accent-color:var(--p1);height:28px}
.rngends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.recap{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.recap li{display:flex;justify-content:space-between;gap:16px;padding:10px 14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.recap li b{font-family:var(--display);font-weight:800;letter-spacing:.05em;text-transform:uppercase}

/* Hub giochi */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.gcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;min-height:clamp(240px,42vh,380px);padding:28px 24px;border:0;color:var(--on-p);cursor:pointer;clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));transition:transform .18s,filter .18s}
.gcard:hover{transform:translateY(-4px);filter:brightness(1.1)}
.gcard.l{background:var(--p2)}
.gcard.r{background:var(--p1)}
.gcard .gt{font-family:var(--display);font-weight:900;font-size:clamp(2rem,4vw,3rem);line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.gcard .gd{font-size:1rem;opacity:.9;max-width:26ch}
.gcard .gtag{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;border:2px solid currentColor;padding:4px 12px;margin-top:6px}
.gcard .gnum{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.75rem;letter-spacing:.2em;opacity:.8}
.go .row .btn.back{justify-self:start}
@media (max-width:760px){ .hub{grid-template-columns:1fr}
  .cseg{flex-direction:column}
  .cb + .cb{border-left:0;border-top:2px solid currentColor}
  .cb{padding:5px 3px}
}

/* Home */
body:has(.home) .top{display:none}
body:has(.home){padding-block:14px 14px}
body:has(.home){margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
body:has(.home) .wrap{max-width:1040px;width:100%}
.home{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px;width:100%}
.hero .slab{height:30px;transform:skewX(-24deg)}
.hero .slab.l{background:var(--p2)}
.hero .slab.r{background:var(--p1)}
.hero h1{text-align:center;font-size:clamp(1.8rem,4.4vw,3.3rem);line-height:.9;margin:0;white-space:nowrap}
.hero .sub{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--mono);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:-4px}
.hero .sub i{width:8px;height:8px;background:var(--fg);transform:rotate(45deg)}
.panels{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr);gap:20px;width:100%;align-items:stretch}
.panel{display:flex;flex-direction:column;gap:12px;padding:0 0 16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.panel .ph{margin:0;padding:8px 18px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:.14em;text-transform:uppercase;color:var(--on-p)}
.panel.pl .ph{background:var(--p2)}
.panel.pr .ph{background:var(--p1)}
.panel.pl .pb{justify-content:space-evenly}
.panel .pb{display:flex;flex-direction:column;gap:10px;padding:0 18px;flex:1;min-height:0}
.lab{margin:6px 0 0;text-align:center;font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;gap:8px}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.c4 .tile{padding:10px 3px}
.seg.c4 .cap{font-size:.56rem;letter-spacing:0;max-width:100%;overflow:hidden}
.seg.c1{grid-template-columns:minmax(0,1fr)}
.tile.chat{flex-direction:row;gap:10px;padding:7px 10px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.tile.chat .tt{font-size:.85rem}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:10px 8px;cursor:pointer;background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:background .15s,color .15s}
.tile input{position:absolute;opacity:0;pointer-events:none;inset:0}
.tile:hover{color:var(--fg)}
.tile:has(input:focus-visible){outline:3px solid var(--fg);outline-offset:-4px}
.tile.dis{opacity:.38;cursor:not-allowed}
.tile .big{font-family:var(--display);font-weight:900;font-size:2.2rem;line-height:1}
.tile .cap{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.tile .tt{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.pl .tile:has(input:checked){background:var(--p2);color:var(--on-p);box-shadow:none}
.pr .tile:has(input:checked){background:var(--p1);color:var(--on-p);box-shadow:none}
.hint2{margin:0;min-height:1.5em;text-align:center;font-size:.88rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:auto;gap:8px;flex:1}
.tile.cat{gap:3px;padding:6px 8px}
@media (max-height:760px){ .tile.cat{padding:3px 8px;gap:1px} .cats{gap:6px} .home{gap:10px} .cseg{min-height:32px} .panel{gap:8px} .panel .pb{gap:6px} }
.tile.cat .num{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;opacity:.8}
.tile.cat .tt{font-size:.98rem;letter-spacing:0}
.tile.cat .ds.nods{display:none}
.tile.cat .ds{font-size:.78rem;line-height:1.25;opacity:.85;text-transform:none}
.tile.cat .ct{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;opacity:.8}
.tile.cat .ck{position:absolute;top:7px;right:16px;width:16px;height:16px;border:2px solid currentColor;opacity:.6}
.tile.cat:has(input:checked) .ck{background:var(--on-p);opacity:1;border-color:var(--on-p)}
.tile.cat:has(input:checked) .ck::after{content:'';position:absolute;left:3px;top:0;width:4px;height:8px;border:solid var(--p1);border-width:0 2px 2px 0;transform:rotate(45deg)}
.go{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.go .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;width:100%}
.go .row i{height:2px;background:var(--line)}
.go .btn.primary{font-size:1.7rem;padding:9px 56px;letter-spacing:.14em}
@media (max-width:760px){
  .panels{grid-template-columns:1fr}
  .hero{gap:12px}
  .hero .slab{height:18px}
}

/* Setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.setup p.lead{font-size:1.1rem;max-width:34ch;margin:0 0 12px}
.setup p.small{color:var(--muted);font-size:.9rem;max-width:44ch;margin:0}
.groups{display:flex;flex-direction:column;gap:10px;min-width:0}
.group{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.group input{width:22px;height:22px;accent-color:var(--fg);flex:none}
.group span.name{font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;line-height:1;flex:1;min-width:0}
.group span.n{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.startrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:6px}
.btn{background:transparent;border:2px solid var(--fg);padding:10px 18px;font-weight:600;letter-spacing:.02em}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.primary{background:var(--fg);color:var(--bg);font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;padding:10px 28px;letter-spacing:.04em}
.btn.primary:hover{opacity:.88}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.armed{background:var(--p1);border-color:var(--p1);color:var(--on-p)}
.btn.both{border-color:var(--fg)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{border-color:var(--fg);color:var(--bg)}

/* Play */
.status{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.status .round{font-family:var(--display);font-weight:800;font-size:1.6rem;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.status .meta{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bye{font-size:.9rem;color:var(--muted);margin:-8px 0 0}
.bar{height:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);width:0;transition:width .3s}

.duel{display:grid;grid-template-columns:1fr 1fr;isolation:isolate;position:relative}
.card{
  position:relative;border:0;text-align:left;color:var(--on-p);
  min-height:clamp(380px,56vh,480px);padding:24px 28px 20px;
  display:flex;flex-direction:column;justify-content:space-between;gap:20px;overflow:hidden;
  transition:transform .18s,opacity .25s,filter .25s;
}
.card.c0{background:var(--p2);clip-path:polygon(0 0,100% 0,calc(100% - var(--cut)) 100%,0 100%);padding-right:calc(var(--cut) + 28px)}
.card.c1{background:var(--p1);clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%);margin-left:calc(var(--cut) * -1 + 10px);padding-left:calc(var(--cut) + 28px);text-align:right;align-items:flex-end}
.card{--pt:56px;--pb:104px;--pf:.68;--po:.16}
.card .gtitle{position:absolute;top:calc(var(--pt,56px)/2);left:calc(50% - var(--cut)/4);transform:translate(-50%,-50%);max-width:76%;z-index:2;text-align:center;font-size:clamp(.85rem,1.15vw,1.05rem);font-weight:600;line-height:1.15;letter-spacing:.01em;opacity:.95;overflow-wrap:anywhere;pointer-events:none}
.card.c1 .gtitle{left:calc(50% + var(--cut)/4)}
.card .ghost{display:none}
.card:hover{transform:translateY(-4px)}
.card:focus-visible{outline:4px solid #fff;outline-offset:-10px}
.card .tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.card .ghost{position:absolute;bottom:-28px;font-family:var(--display);font-weight:900;font-size:13rem;line-height:1;opacity:.14;pointer-events:none}
.card.c0 .ghost{left:14px}
.card.c1 .ghost{right:14px}
.card .name{position:relative;margin-top:auto}
.card .main{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(1.7rem,4vw,3.2rem);line-height:.92;letter-spacing:.01em;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.card .sub{display:block;margin-top:10px;font-size:1.05rem;font-weight:500;opacity:.92;overflow-wrap:anywhere}
.card .hint{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;opacity:.8;position:relative}
.card.won{transform:scale(1.02);filter:brightness(1.12)}
.card.lost{opacity:.25;filter:grayscale(1)}
.vs{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  width:76px;height:76px;display:grid;place-items:center;
  background:var(--bg);color:var(--fg);border:3px solid var(--fg);
  font-family:var(--display);font-weight:900;font-size:2.1rem;transform-origin:center;rotate:45deg;
  translate:0 0;
}
.vs span{rotate:-45deg}
.vs{transform:translate(-50%,-50%) rotate(0)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.duel + .players,.outcome + .players{margin-top:14px}


/* Ritratti */
.portrait{position:absolute;top:calc(var(--pt,26px) + (100% - var(--pt,26px) - var(--pb,168px))*var(--po,.08));height:calc((100% - var(--pt,26px) - var(--pb,168px))*var(--pf,.84));left:50%;transform:translateX(-50%);aspect-ratio:1/1;max-width:78%;border:3px solid rgba(255,255,255,.92);background:rgba(255,255,255,.16);overflow:hidden;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.portrait.tall{aspect-ratio:3/4}
.portrait.media{height:auto;width:74%;max-width:none;aspect-ratio:16/9;top:calc(var(--pt,26px) + (100% - var(--pt,26px) - var(--pb,168px))/2);transform:translate(-50%,-50%)}
.portrait .mono{display:none!important}
.portrait.wait .mono{visibility:hidden}
.pdot{position:absolute;top:calc(var(--pt,26px) + (100% - var(--pt,26px) - var(--pb,168px))*.5 - 11px);z-index:4;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 0 0 4px rgba(255,255,255,.28),0 2px 8px rgba(0,0,0,.4);cursor:pointer;outline:none}
.pdot:hover,.pdot:focus-visible,.pdot.open{box-shadow:0 0 0 6px rgba(255,255,255,.4),0 2px 10px rgba(0,0,0,.5)}
.card.c0 .pdot{left:16px}
.card.c1 .pdot{right:16px}
.ppop{position:fixed;top:50%;transform:translateY(-50%);z-index:50;padding:6px;background:var(--bg);border:3px solid #fff;box-shadow:0 14px 40px rgba(0,0,0,.6);pointer-events:none;line-height:0}
.ppop img{display:block;width:auto;height:auto;max-width:min(640px,92vw);max-height:84vh;background:#000}
.duel.loading{visibility:hidden}
.loadnote{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;font-family:var(--mono);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);z-index:5;pointer-events:none}
.card.c1 .portrait.media{width:calc(74% - (var(--cut) - 10px)*.74)}
.card.c0 .portrait{left:calc(50% - var(--cut)/4)}
.card.c1 .portrait{left:calc(50% + var(--cut)/4)}
.portrait.desc{height:calc((100% - var(--pt,26px) - var(--pb,168px))*var(--pf,.84));width:68%;max-width:none;aspect-ratio:auto;display:flex;align-items:center;justify-content:center;padding:14px 16px;background:rgba(255,255,255,.12);overflow:hidden}
.portrait.desc p{margin:0;font-size:clamp(.95rem,1.4vw,1.3rem);line-height:1.45;text-align:center;color:#fff;font-weight:500;overflow-wrap:anywhere}
.card.c1 .portrait.desc{width:calc(68% - (var(--cut) - 10px)*.68)}
.portrait.desc.hasico{flex-direction:column;gap:10px}
.portrait.desc .ico{display:block;flex:none;width:clamp(48px,7.2vw,104px);height:clamp(48px,7.2vw,104px)}
.portrait.desc .ico svg{display:block;width:100%;height:100%;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.portrait.desc.hasico p{font-size:clamp(.85rem,1.1vw,1.05rem);line-height:1.4}
.portrait .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:4rem;color:#fff;opacity:.85;letter-spacing:.02em}
.portrait iframe,.portrait video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.portrait.tall img{object-position:top center}
.duel.compact .portrait,.duel.compact .pdot{--pb:120px}
.duel.compact .card{--pt:48px;--pb:120px;--pf:.84;--po:.08}
.duel.compact .portrait .mono{font-size:2.4rem}

/* Due giocatori */

  var CLASSI_DATA = [["Barbaro", "Combattente di pura forza fisica, che affronta il nemico a viso aperto con armi enormi e una furia che cresce a ogni ferita. Porta poca armatura e confida nella resistenza e nell'impeto, non nella tecnica."], ["Paladino", "Guerriero sacro legato a un giuramento. Armatura pesante e scudo per proteggere i deboli, e una luce divina che guarisce gli alleati e colpisce il male."], ["Cavaliere", "Combattente in armatura pesante che segue un codice d'onore. Resistente e disciplinato, è fatto per reggere la prima linea con spada e scudo."], ["Cavaliere Dragone", "Lanciere che spicca un salto altissimo e piomba sul bersaglio con un affondo devastante. Il suo stile si ispira ai draghi, di cui spesso porta l'armatura o la forza."], ["Cavaliere della Morte", "Ex campione richiamato dalla tomba, che unisce armatura pesante e magia della morte. Gelo, sangue e non morti sono le sue armi, e la sua resistenza è quella di chi è già morto una volta."], ["Cavaliere Mistico", "Combattente di lancia che intreccia colpi fisici e magia a corto raggio. Non è né un guerriero puro né un mago: fa male in ogni modo, ma resta sempre vicino al nemico."], ["Distruttore", "Combattente senza scudo, con armi enormi come spadoni e martelli. Ogni colpo è lento e devastante, e basta uno solo per cambiare l'esito di uno scontro."], ["Samurai", "Guerriero disciplinato con katana e arco. Preciso, rapido e legato a un codice d'onore, passa dall'attacco a distanza al duello con la stessa freddezza."], ["Amazzone", "Guerriera con lancia e arco, nata per la caccia e la battaglia. Agile e letale sia da vicino sia da lontano."], ["Mago da battaglia", "Ibrido che unisce armatura e armi pesanti alla magia. Rinuncia alla potenza pura dei maghi in cambio di robustezza in mischia."], ["Crociato", "Guerriero armato di fede che porta la guerra santa contro il male, con scudo, armatura pesante e colpi benedetti. Più bastione d'assalto che guaritore."], ["Templare", "Soldato di un ordine sacro, addestrato a contrastare la magia e chi la usa. Armatura pesante, disciplina ferrea e la capacità di annullare gli incantesimi dei nemici."], ["Berserker", "Guerriero che si abbandona a una furia incontrollata: infligge danni enormi ma perde difesa e lucidità. Rinuncia a ogni cautela e spesso anche all'armatura."], ["Gladiatore", "Combattente da arena, abituato a duellare sotto gli occhi del pubblico. Armi varie come rete, tridente e spada corta, tecnica da spettacolo e grande resistenza."], ["Mercenario", "Soldato di ventura che combatte per chi lo paga. Pratico e senza ideali da difendere, usa ciò che serve per vincere, che sia una lama, un arco o una pistola."], ["Guardiano", "Difensore che sceglie di proteggere qualcuno o qualcosa. Scudo, tenacia e la capacità di attirare su di sé i colpi dei nemici per salvare gli alleati."], ["Cavaliere Oscuro", "Guerriero in armatura nera che attinge forza dal buio, spesso sacrificando la propria vita per colpire più forte. Spada pesante e un potere che consuma chi lo usa."], ["Spadaccino", "Combattente di scherma che punta su tecnica e velocità più che sulla forza. Lama sottile, parate precise e affondi al momento giusto."], ["Lanciere", "Combattente d'asta che sfrutta la portata dell'arma per tenere lontano il nemico. Controlla lo spazio e punisce chi prova ad avvicinarsi."], ["Pirata", "Combattente di mare con sciabola, pistola e poca etica. Si affida all'astuzia, al bottino e a uno stile di lotta sporco e imprevedibile."], ["Ladro", "Furtivo, agile e opportunista. Scassina serrature, disattiva trappole, colpisce alle spalle e sparisce prima che qualcuno capisca cosa è successo."], ["Assassino", "Killer di precisione, specializzato in un solo colpo letale. Veleni, lame e ombre sono i suoi strumenti, e il bersaglio è quasi sempre uno solo."], ["Ninja", "Maestro di velocità e furtività, con shuriken, lame corte e tecniche segrete. Colpisce da dove non lo si aspetta e se ne va prima della reazione."], ["Arciere", "Specialista dell'arco e del tiro a distanza. Mira ai punti deboli e scocca frecce in movimento, ma è fragile se qualcuno gli arriva addosso."], ["Ranger", "Esploratore delle terre selvagge, tracciatore e arciere, spesso con un animale compagno. A suo agio lontano dalle città, sa muoversi e sopravvivere dove altri si perdono."], ["Cacciatore", "Specialista nella caccia a bestie e creature, con trappole, arma a distanza e un animale addestrato al fianco. Conosce le abitudini della preda e la aspetta."], ["Pistolero", "Combattente che usa armi da fuoco anziché lame o magie. Colpisce da lontano con precisione, ricarica sotto pressione e punta tutto sul tempo di reazione."], ["Cacciatore di Demoni", "Cacciatore votato a sterminare i demoni, che per riuscirci ha rinunciato a ogni scrupolo e spesso ha fatto proprio un potere proibito. Agile, rapido e spietato, colpisce sia da lontano sia da vicino."], ["Domatore", "Esperto di creature selvagge, che cattura, addestra e comanda mostri perché combattano al suo posto. La sua forza è il branco che porta con sé."], ["Cecchino", "Tiratore paziente che colpisce da lontanissimo con un solo colpo. Poco mobile e vulnerabile da vicino, ma letale finché resta a distanza."], ["Mimo", "Combattente che copia i movimenti e le tecniche degli alleati e li ripete. Il suo potere dipende da chi gli sta accanto."], ["Elementalista", "Mago che domina fuoco, ghiaccio, fulmine e terra. Sceglie l'elemento più adatto a ogni nemico e controlla il campo con tempeste e muri di fiamme."], ["Piromante", "Specialista del fuoco, che lo evoca, lo modella e lo trasforma in arma. Distrugge a distanza e brucia ciò che rimane."], ["Negromante", "Mago che manipola la morte e le ossa. Richiama scheletri e non morti a servirlo e getta maledizioni che prosciugano i nemici."], ["Evocatore", "Incantatore che chiama alleati da altri piani: creature, spiriti, entità. Combatte tramite ciò che richiama, ed è fragile quando resta solo."], ["Illusionista", "Maestro dell'inganno, che confonde i sensi del nemico con illusioni, fumo e false immagini. Non distrugge, ma fa sì che i nemici si colpiscano da soli."], ["Stregone", "Incantatore nato con la magia nel sangue: non l'ha studiata, la possiede. Il suo potere è grezzo, potente e a volte imprevedibile."], ["Warlock", "Incantatore che ha ottenuto il potere stringendo un patto con un'entità, e ne paga il prezzo. Magia oscura, maledizioni e una forza che non è mai del tutto sua."], ["Mago Nero", "Incantatore di magia distruttiva: fuoco, ghiaccio, fulmini. Fragile sul corpo ma pericolosissimo a distanza."], ["Mago Bianco", "Incantatore di magie di cura, protezione e luce. Tiene in piedi il gruppo e sa respingere i non morti."], ["Mago Rosso", "Ibrido che padroneggia sia la magia bianca sia quella nera, oltre a un po' di scherma. Mai il migliore in nulla, ma raramente impreparato."], ["Mago del Tempo", "Incantatore che manipola il tempo: accelera gli alleati, rallenta i nemici e interviene sull'ordine degli eventi."], ["Astrologo", "Studioso del cielo che trae la magia dalle stelle e dalle sfere celesti. Lancia incantesimi cosmici a distanza."], ["Alchimista", "Studioso di pozioni, veleni, esplosivi e trasmutazioni. Il suo potere sta in ciò che prepara prima del combattimento."], ["Arciere Mago", "Arciere che incanala la magia nelle frecce. Colpisce a distanza e le sue frecce inseguono il bersaglio, esplodono o bruciano."], ["Ingegnere", "Combattente tecnico che costruisce gadget, torrette e ordigni. Prepara il terreno e vince con ciò che ha messo in campo."], ["Mago Blu", "Incantatore che impara le magie dai mostri, subendone gli attacchi. Il suo repertorio è fatto di tecniche mostruose raccolte sul campo."], ["Geomante", "Incantatore che trae potere dal terreno e dal paesaggio: ciò che calpesta cambia la sua magia. Scatena terremoti, voragini e frane."], ["Chimico", "Esperto di preparati e oggetti curativi: sfrutta pozioni e antidoti molto meglio degli altri e sostiene il gruppo con ciò che porta nella borsa."], ["Runista", "Incantatore che incide rune su armi, armature e terreno e le attiva per ottenere effetti precisi. La preparazione conta più dell'improvvisazione."], ["Mago del Sangue", "Incantatore che usa il sangue, proprio o altrui, come fonte di potere. Sacrifica la propria vita per colpire più forte e piega la volontà degli altri."], ["Chierico", "Servitore di una divinità, che canalizza il potere divino per guarire, proteggere e punire. Combatte in prima linea con armatura robusta senza rinunciare alle cure."], ["Sacerdote", "Devoto che resta dietro le linee a guarire e benedire gli alleati. Alcuni scelgono la via dell'ombra e usano la fede come arma oscura."], ["Profeta", "Veggente che pone la fede e le visioni al centro del suo potere. Incantesimi sacri e protezione, senza rinunciare alle armi in mischia."], ["Druido", "Custode della natura, che parla con piante, animali e stagioni e può assumere forme animali. Cura, controlla il campo e si trasforma per combattere da vicino."], ["Sciamano", "Guida spirituale che dialoga con elementi e antenati. Evoca totem, spiriti e tempeste per aiutare gli alleati o abbattere i nemici."], ["Spiritista", "Combattente acrobatico di mischia che incanala nel proprio corpo la forza di spiriti animali, come giaguaro, gorilla, aquila e centopiedi, senza mai trasformarsi. Concatena colpi rapidi, para e schiva rimandando l'energia al nemico."], ["Monaco", "Asceta che ha trasformato il proprio corpo in arma. Combatte a mani nude con velocità, equilibrio ed energia interiore."], ["Bardo", "Cantastorie e musicista che usa canzoni e carisma come armi. Sostiene gli alleati, indebolisce i nemici e se la cava in qualsiasi situazione."], ["Guaritore", "Specialista della cura: rigenera ferite, rimuove veleni e malattie, rialza i caduti. Quasi mai attacca, ma tiene in vita il gruppo."], ["Danzatore", "Combattente che usa danza e ritmo come armi: confonde i nemici, sostiene gli alleati e colpisce con movimenti fluidi ed eleganti."], ["Inquisitore", "Giustiziere di un ordine che scova eresie, magia proibita e traditori. Armato di fede, interrogatori e spesso di un'arma pesante."], ["Esorcista", "Specialista nello scacciare demoni, spiriti e possessioni. Rituali, simboli sacri e armi benedette per rimandare le entità dove appartengono."]];

  /* Poteri e Meccaniche: carte senza gioco; nel riquadro c'e' un'icona disegnata e la descrizione. */
  var MECC_DATA = [["Doppio salto", "Un secondo salto eseguito a mezz'aria, che permette di superare vuoti e piattaforme più alte di quanto un salto normale consenta.", "<path d=\"M18 28 L32 14 L46 28\"/><path d=\"M18 42 L32 28 L46 42\"/><path d=\"M10 56 H54\"/>"], ["Salto a muro", "Rimbalzare contro una parete per darsi una nuova spinta, così da risalire tra due muri vicini saltando dall'uno all'altro.", "<path d=\"M52 6 V58\"/><path d=\"M52 18 H58 M52 32 H58 M52 46 H58\"/><path d=\"M12 54 L42 38 L16 26 L40 10\"/><path d=\"M30 10 H40 V20\"/>"], ["Aggrapparsi al muro", "Restare appesi a una parete e scivolare lentamente invece di precipitare, guadagnando tempo per decidere il prossimo salto.", "<path d=\"M14 6 V58\"/><path d=\"M14 18 H8 M14 32 H8 M14 46 H8\"/><circle cx=\"38\" cy=\"16\" r=\"6\"/><path d=\"M36 23 L32 42 M36 28 L18 24 M32 42 L40 54 M32 42 L24 54\"/><path d=\"M54 24 V44 M48 38 L54 44 L60 38\"/>"], ["Scatto", "Una breve spinta veloce in una direzione, per superare un nemico, evitare un colpo o coprire una distanza in un istante.", "<path d=\"M6 22 H28 M2 32 H30 M8 42 H28\"/><path d=\"M32 32 H58 M48 22 L58 32 L48 42\"/>"], ["Scatto aereo", "Uno scatto eseguito a mezz'aria, di solito una volta per salto, che cambia la traiettoria o allunga la distanza percorsa.", "<path d=\"M8 48 Q16 14 34 26\"/><path d=\"M34 26 H58 M50 18 L58 26 L50 34\"/><path d=\"M6 58 H58\" stroke-dasharray=\"4 5\"/>"], ["Planata", "Rallentare la caduta con ali, mantello o altro strumento, per coprire distanze molto più lunghe durante la discesa.", "<path d=\"M6 28 Q32 -2 58 28 Q44 20 32 24 Q20 20 6 28 Z\"/><path d=\"M12 29 L32 46 M32 25 V46 M52 29 L32 46\"/><circle cx=\"32\" cy=\"52\" r=\"5\"/>"], ["Rampino", "Un gancio lanciato verso un punto o un nemico per tirarsi verso di esso, dondolare o attraversare grandi vuoti.", "<path d=\"M40 8 H60\"/><path d=\"M50 8 V20 Q50 30 42 30 Q36 30 36 24\"/><path d=\"M42 30 Q28 40 14 52\"/><circle cx=\"12\" cy=\"54\" r=\"4\"/>"], ["Arrampicata", "Scalare pareti, rocce o edifici dove la superficie lo permette. In molti giochi consuma stamina.", "<path d=\"M6 24 H58\"/><path d=\"M18 24 V12 M27 24 V8 M37 24 V8 M46 24 V12\" stroke-width=\"5\"/><path d=\"M14 30 Q14 52 32 54 Q50 52 50 30\"/>"], ["Sprint", "Correre più veloce del normale per un tempo limitato, di solito consumando stamina.", "<circle cx=\"38\" cy=\"10\" r=\"5\"/><path d=\"M36 18 L30 36 M36 22 L48 28 M36 22 L22 26 M30 36 L42 46 L38 58 M30 36 L20 44 L10 42\"/><path d=\"M4 20 H14 M2 30 H12\"/>"], ["Scivolata", "Strisciare sul terreno durante la corsa, passando sotto ostacoli bassi o mantenendo velocità in discesa.", "<circle cx=\"14\" cy=\"30\" r=\"5\"/><path d=\"M18 35 L40 44 H56 M20 36 L30 28\"/><path d=\"M4 58 H60\"/><path d=\"M42 30 H58 M46 38 H60\"/>"], ["Corsa sui muri", "Correre in verticale o lungo una parete per un breve tratto, sfruttando lo slancio per superare ostacoli e raggiungere punti alti.", "<path d=\"M52 6 V58\"/><path d=\"M52 16 H60 M52 30 H60 M52 44 H60\"/><path d=\"M30 58 V14 M20 24 L30 14 L40 24\"/><path d=\"M20 50 H26 M34 40 H40 M20 32 H26\" stroke-dasharray=\"2 4\"/>"], ["Salto con il razzo", "Sfruttare l'onda d'urto di un'esplosione sotto di sé per essere lanciati molto in alto, accettando di subire danni.", "<polygon points=\"32,34 37,43 47,41 41,49 49,56 38,55 32,62 26,55 15,56 23,49 17,41 27,43\"/><path d=\"M32 28 V6 M22 16 L32 6 L42 16\"/>"], ["Jetpack", "Zaino a propulsione che permette di salire e librarsi per un tempo limitato, finché dura il carburante.", "<path d=\"M20 8 H44 V38 H20 Z\"/><path d=\"M32 8 V38 M20 18 H44\"/><path d=\"M26 42 Q22 52 26 60 Q30 52 26 42 M38 42 Q34 52 38 60 Q42 52 38 42\"/>"], ["Immersione", "Muoversi sott'acqua: scendere in profondità, trattenere il fiato e raggiungere zone altrimenti irraggiungibili.", "<path d=\"M2 18 Q10 10 18 18 T34 18 T50 18 T62 18\"/><path d=\"M32 26 V54 M23 45 L32 54 L41 45\"/><circle cx=\"46\" cy=\"34\" r=\"3\"/><circle cx=\"52\" cy=\"46\" r=\"2\"/>"], ["Cavalcare", "Montare animali o creature per spostarsi più in fretta, superare terreni difficili e talvolta combattere in sella.", "<path d=\"M16 58 V28 Q16 8 32 8 Q48 8 48 28 V58\" stroke-width=\"5\"/><circle cx=\"16\" cy=\"22\" r=\"2\" fill=\"#fff\"/><circle cx=\"48\" cy=\"22\" r=\"2\" fill=\"#fff\"/><circle cx=\"19\" cy=\"38\" r=\"2\" fill=\"#fff\"/><circle cx=\"45\" cy=\"38\" r=\"2\" fill=\"#fff\"/>"], ["Palla morph", "Trasformarsi in una piccola sfera che rotola, passando in cunicoli altrimenti inaccessibili. Tipica dei metroidvania.", "<circle cx=\"32\" cy=\"30\" r=\"14\"/><path d=\"M24 24 Q27 20 33 20\"/><path d=\"M8 34 Q8 10 32 8\"/><path d=\"M26 4 L32 8 L26 12\"/><path d=\"M4 56 H60\"/><path d=\"M10 48 H22 M42 48 H54\" stroke-dasharray=\"2 4\"/>"], ["Teletrasporto", "Spostarsi istantaneamente da un punto all'altro, saltando ostacoli e distanze senza attraversarli.", "<circle cx=\"13\" cy=\"32\" r=\"9\" stroke-dasharray=\"3 4\"/><circle cx=\"51\" cy=\"32\" r=\"9\"/><path d=\"M26 32 H38 M33 26 L39 32 L33 38\"/><path d=\"M51 4 V10 M44 8 L47 12 M58 8 L55 12\"/>"], ["Volo", "Muoversi liberamente in aria senza dipendere dal terreno. Può essere un potere, un oggetto o un mezzo.", "<path d=\"M4 34 Q18 12 32 30 Q46 12 60 34 Q46 28 32 44 Q18 28 4 34 Z\"/>"], ["Parata", "Bloccare un colpo con scudo o arma, riducendo o annullando i danni al prezzo di stamina o usura dell'equipaggiamento.", "<path d=\"M32 6 L52 14 V32 Q52 48 32 60 Q12 48 12 32 V14 Z\"/><path d=\"M32 16 V50 M20 28 H44\"/>"], ["Parry", "Parare nell'istante preciso del colpo nemico: annulla il danno del tutto e lascia l'avversario scoperto a un contrattacco.", "<path d=\"M10 54 L40 12 M54 54 L24 12\"/><path d=\"M14 42 L24 50 M50 42 L40 50\"/><path d=\"M32 24 V16 M24 28 L18 22 M40 28 L46 22\"/>"], ["Schivata", "Evitare un colpo con un movimento rapido, spesso con un brevissimo istante di invulnerabilità durante la mossa.", "<circle cx=\"46\" cy=\"18\" r=\"5\" stroke-dasharray=\"3 3\"/><path d=\"M46 25 V42 M46 30 L38 36       var gsel = c.groups[vi];
      wrap.appendChild(duelBlock(gsel.pair, gsel.players, false, pnames(gsel.players) + (c.groups.length > 1 ? ' · sfida ' + (vi+1) + ' di ' + c.groups.length : ''), 'card-g' + vi + '-'));
      c.need.forEach(function(nd, pl){
        if(!nd) wrap.appendChild(h('p', {class:'nopass', text:pname(pl) + ' passa il turno senza duello.'}));
      });
      stage.appendChild(wrap);
      if(revealing && pending) stage.appendChild(h('p', {class:'outcome', text:groupText(c, gsel)}));
    }
    var undoBtn = h('button', {class:'btn ghost', type:'button', id:'btn-undo', text:'Annulla ultima scelta', onclick:undo});
    if(S.vlog.length === 0 || revealing) undoBtn.disabled = true;
    stage.appendChild(h('div', {class:'controls'}, [
      undoBtn,
      guarded('reshuffle','Azzera','Perdi i progressi, confermi?', reshuffle, 'ghost'),
      guarded('reset','Home','Perdi i progressi, confermi?', toSetup, 'ghost')
    ]));
  }

  function ranking2(R, pl){
    var order = (R.champ[pl] !== null ? [R.champ[pl]] : []).concat(R.P[pl].elim.slice().reverse().map(function(e){ return e.id; }));
    var roundOf = {}; R.P[pl].elim.forEach(function(e){ roundOf[e.id] = e.round; });
    return order.map(function(id, i){ return { id:id, pos:i+1, round:roundOf[id] }; });
  }
  function hasImg(id){ return !!(LOCAL_IMG[imgKey(id)] || r2url(id) || imgCache[imgKey(id)]); }
  /* Riquadro del vincitore: testo a sinistra e, se la carta ha un'immagine, il ritratto a destra. */
  function champBox(id, kids){
    if(!hasImg(id)) return h('div', {class:'champ'}, kids);
    return h('div', {class:'champ withimg'}, [h('div', {class:'ctext'}, kids), portrait(id)]);
  }
  function renderDone2(stage, R){
    var cols = h('div', {class:'done2'}), texts = [];
    R.P.forEach(function(_, pl){
      var rows = ranking2(R, pl), ch = R.champ[pl], first, champ;
      if(ch !== null){
        var t = parts_(ch);
        champ = champBox(ch, [h('div', {class:'tag', text:'Vincitore'}), h('p', {class:'main', text:t[0]}), t[1] ? h('span', {class:'sub', text:t[1]}) : null]);
        first = 1;
      } else {
        champ = h('div', {class:'champ'}, [h('div', {class:'tag', text:'Esito'}), h('p', {class:'main', text:'Nessun vincitore'})]);
        first = 0;
      }
      var top = h('ol');
      rows.slice(first, first + 9).forEach(function(r){
        top.appendChild(h('li', null, [h('span', {class:'pos', text:String(r.pos)}), h('span', {class:'t'}, [GAMES[r.id].label, h('span', {class:'r', text: (ch !== null && r.pos === 2) ? 'Finalista' : 'Eliminato al turno ' + r.round})])]));
      });
      cols.appendChild(h('div', {class:'col2'}, [h('span', {class:'pname', text:pname(pl)}), champ, h('div', {class:'rank'}, [top])]));
      texts.push(pname(pl) + '\n' + rows.slice(0, 10).map(function(r){ return r.pos + '. ' + GAMES[r.id].label; }).join('\n'));
    });
    stage.appendChild(cols);
    var allSame = R.champ[0] !== null && R.champ.every(function(x){ return x === R.champ[0]; });
    var line = allSame ? 'Avete scelto tutti lo stesso vincitore.' : 'I vincitori sono diversi.';
    if(R.shared > 0) line += ' Nei ' + R.shared + ' duelli che avete visto uguali siete andati d’accordo ' + R.agree + ' volte (' + Math.round(R.agree / R.shared * 100) + '%).';
    stage.appendChild(h('p', {class:'outcome', text:line}));
    var msgEl = h('span', {class:'msg', id:'msg', text:msg});
    stage.appendChild(h('div', {class:'controls'}, [
      h('button', {class:'btn primary', type:'button', id:'btn-again', text:'Rigioca', onclick:reshuffle}),
      h('button', {class:'btn', type:'button', id:'btn-back', text:'Cambia selezione', onclick:toSetup}),
      h('button', {class:'btn ghost', type:'button', id:'btn-undo2', text:'Annulla ultima scelta', onclick:undo}),
      msgEl
    ]));
  }
  function renderLists2(R){
    var box = document.getElementById('lists'); box.textContent = '';
    R.P.forEach(function(_, pl){
      if(R.done){
        var rows = ranking2(R, pl), ul = h('ul', {class:'chips'});
        rows.forEach(function(r){ ul.appendChild(h('li', null, [r.pos + '. ' + GAMES[r.id].label])); });
        box.appendChild(h('details', null, [h('summary', {text:pname(pl) + ': classifica completa (' + rows.length + ')'}), ul]));
        return;
      }
      var gone = h('ul', {class:'chips'});
      R.P[pl].elim.slice().reverse().forEach(function(e){ gone.appendChild(h('li', null, [GAMES[e.id].label, h('small', {text:'T' + e.round})])); });
      box.appendChild(h('details', null, [h('summary', {text:pname(pl) + ': eliminati (' + R.P[pl].elim.length + ')'}), R.P[pl].elim.length ? gone : h('p', {class:'msg', style:'padding:0 16px 14px', text:'Ancora nessuno.'})]));
    });
  }

  /* Scelta comune: un solo tabellone, va avanti solo cio che scegliete tutti (o la maggioranza, con 3 giocatori). */
  function vote3(pl, v){
    if(revealing || S.phase !== 'play' || votes[pl] !== null) return;
    var R = replay(S.ids, S.seed, S.choices); if(R.done) return;
    votes[pl] = v;
    if(votes.every(function(x){ return x !== null; })) startReveal3(R); else render();
  }
  function startReveal3(R){
    var p = R.cur.pairs[R.cur.idx], vs = votes.slice(), res = 2, text = '';
    var cnt = [0,0,0]; vs.forEach(function(x){ cnt[x]++; });
    var thr = Math.floor(vs.length / 2) + 1;
    var unanimous = vs.every(function(x){ return x === vs[0]; });
    var win = function(r){ return r === 2 ? 'Escono entrambi.' : 'Resta ' + GAMES[p[r]].title + '.'; };
    if(unanimous){ res = vs[0]; text = 'D’accordo. ' + win(res); }
    else if(S.players >= 3 && S.rule3 === 'maj' && (cnt[0] >= thr || cnt[1] >= thr || cnt[2] >= thr)){
      res = cnt[0] >= thr ? 0 : (cnt[1] >= thr ? 1 : 2); text = 'Decide la maggioranza. ' + win(res);
    }
    else { res = 2; text = 'Non siete d’accordo: escono entrambi.'; }
    pending = { res:res, entry:vs, text:text };
    revealing = true;
    var tok = ++revealToken;
    render();
    setTimeout(function(){ commit(tok); }, reduce ? 1200 : 2200);
  }
  function renderPlay3(stage, R){
    var c = R.cur, p = c.pairs[c.idx];
    stage.appendChild(h('div', {class:'status'}, [
      h('span', {class:'round', text:roundLabel(R)}),
      h('span', {class:'meta', text:'Duello ' + (c.idx+1) + ' di ' + c.pairs.length})
    ]));
    if(c.bye !== null && c.idx === 0) stage.appendChild(h('p', {class:'bye', text:'Passa il turno senza duello: ' + GAMES[c.bye].label}));
    var bar = h('div', {class:'bar','aria-hidden':'true'}, [h('i')]);
    bar.firstChild.style.width = Math.min(100, Math.round(R.elim.length / (S.ids.length - 1) * 100)) + '%';
    stage.appendChild(bar);
    var badges = [[],[]], cls = ['',''];
    if(revealing && pending){
      votes.forEach(function(v, pl){ if(v===0 || v===2) badges[0].push(gs(pl)); if(v===1 || v===2) badges[1].push(gs(pl)); });
      if(pending.res === 2){ cls = ['lost','lost']; } else { cls[pending.res] = 'won'; cls[1 - pending.res] = 'lost'; }
    }
    stage.appendChild(h('div', {class:'duel'}, [card2(0, p[0], badges[0], cls[0], 'card-'), card2(1, p[1], badges[1], cls[1], 'card-'), h('div', {class:'vs','aria-hidden':'true'}, [h('span', {text:'VS'})])]));
    if(revealing && pending) stage.appendChild(h('p', {class:'outcome', text:pending.text}));
    stage.appendChild(h('div', {class:'players'}, votes.map(function(_, pl){ return playerRow(pl); })));
    var undoBtn = h('button', {class:'btn ghost', type:'button', id:'btn-undo', text:'Annulla ultima scelta', onclick:undo});
    if(S.choices.length === 0 || revealing) undoBtn.disabled = true;
    stage.appendChild(h('div', {class:'controls'}, [
      undoBtn,
      guarded('reshuffle','Azzera','Perdi i progressi, confermi?', reshuffle, 'ghost'),
      guarded('reset','Home','Perdi i progressi, confermi?', toSetup, 'ghost')
    ]));
  }

  function ranking(R){
    var order = (R.champion !== null ? [R.champion] : []).concat(R.elim.slice().reverse().map(function(e){return e.id;}));
    var roundOf = {}; R.elim.forEach(function(e){ roundOf[e.id] = e.round; });
    return order.map(function(id,i){ return {id:id, pos:i+1, round:roundOf[id]}; });
  }
  function rankText(rows){ return rows.slice(0,10).map(function(r){ return r.pos + '. ' + GAMES[r.id].label; }).join('\n'); }

  function renderDone(stage, R){
    var rows = ranking(R), champ, firstRank;
    if(R.champion !== null){
      var t = parts(R.champion);
      champ = champBox(R.champion, [
        h('div', {class:'tag', text:'Vincitore su ' + S.ids.length + ' elementi'}),
        h('p', {class:'main', text:t[0]}),
        t[1] ? h('span', {class:'sub', text:t[1]}) : null
      ]);
      firstRank = 1;
    } else {
      champ = h('div', {class:'champ'}, [
        h('div', {class:'tag', text:'Su ' + S.ids.length + ' elementi'}),
        h('p', {class:'main', text:'Nessun vincitore'}),
        h('span', {class:'sub', text:'Gli ultimi due sono stati eliminati insieme.'})
      ]);
      firstRank = 0;
    }
    var top = h('ol');
    rows.slice(firstRank, firstRank + 9).forEach(function(r){
      var tt = GAMES[r.id].label;
      top.appendChild(h('li', null, [h('span',{class:'pos', text:String(r.pos)}), h('span',{class:'t'}, [tt, h('span',{class:'r', text: (R.champion !== null && r.pos===2) ? 'Finalista' : 'Eliminato al turno ' + r.round})])]));
    });
    var rank = h('div', {class:'rank'}, [h('h2', {text:'Podio e dintorni'}), top]);
    var msgEl = h('span', {class:'msg', id:'msg', text:msg});
    stage.appendChild(h('div', {class:'done'}, [champ, rank]));
    if(S.mode === 3 && S.vlog.length){
      var agree3 = S.vlog.filter(function(v){ return v.every(function(x){ return x === v[0]; }); }).length;
      stage.appendChild(h('p', {class:'outcome', text:'Siete andati d’accordo in ' + agree3 + ' duelli su ' + S.vlog.length + ' (' + Math.round(agree3 / S.vlog.length * 100) + '%).'}));
    }
    stage.appendChild(h('div', {class:'controls'}, [
      h('button', {class:'btn primary', type:'button', id:'btn-again', text:'Rigioca', onclick:reshuffle}),
      h('button', {class:'btn', type:'button', id:'btn-back', text:'Cambia selezione', onclick:toSetup}),
      h('button', {class:'btn ghost', type:'button', id:'btn-undo2', text:'Annulla ultima scelta', onclick:undo}),
      msgEl
    ]));
  }

  function renderLists(R){
    var box = document.getElementById('lists'); box.textContent = '';
    if(S.phase!=='play') return;
    if(R.done){
      var rows = ranking(R);
      var ul = h('ul', {class:'chips'});
      rows.forEach(function(r){ ul.appendChild(h('li', null, [r.pos + '. ' + GAMES[r.id].label])); });
      box.appendChild(h('details', null, [h('summary', {text:'Classifica completa (' + rows.length + ')'}), ul]));
      return;
    }
    var gone = h('ul', {class:'chips'});
    R.elim.slice().reverse().forEach(function(e){ gone.appendChild(h('li', null, [GAMES[e.id].label, h('small',{text:'T'+e.round})])); });
    box.appendChild(h('details', null, [h('summary', {text:'Eliminati (' + R.elim.length + ')'}), R.elim.length ? gone : h('p',{class:'msg', style:'padding:0 16px 14px', text:'Ancora nessuno.'})]));
  }

  function render(){
    Array.prototype.forEach.call(document.querySelectorAll('body > .ppop'), function(x){ x.parentNode.removeChild(x); });
    var stage = document.getElementById('stage'); stage.textContent = '';
    if(screen){
      document.getElementById('lists').textContent = '';
      if(screen === 'quiz') renderQuizSoon(stage); else if(screen === 'quizgo') renderQuizGo(stage); else renderHub(stage);
      return;
    }
    var R = null, two = S.mode === 2;
    if(S.phase === 'play'){ R = two ? replay2(S.ids, S.seed, S.vlog) : replay(S.ids, S.seed, S.choices); }
    renderStats(R);
    if(S.phase === 'setup') renderSetup(stage);
    else if(two){ if(R.done) renderDone2(stage, R); else renderPlay2(stage, R); }
    else if(R.done) renderDone(stage, R);
    else if(S.mode === 3) renderPlay3(stage, R);
    else renderPlay(stage, R);
    if(S.phase === 'play' && two) renderLists2(R); else renderLists(R);
    hydrate(); prefetchNext(R);
  }

  load();
  if(S.phase === 'setup') screen = 'hub';
  votes = nullVotes();
  render();
})();
</script>
