<title>Would Kraymes Rather</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: schermata VS a due pannelli con taglio diagonale. Due schieramenti (blu a sinistra, rosso a destra), tutto il resto in neutri freddi. */
:root{
  --bg:#E7EAEF; --surface:#F4F6F9; --fg:#12141A; --muted:#566070; --line:#C5CBD6;
  --p1:#C8261D; --p2:#1D55C9; --on-p:#FFFFFF;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  --cut:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1016; --surface:#171A23; --fg:#ECEEF3; --muted:#8F99AB; --line:#2A3040;
    --p1:#CF2F25; --p2:#2F66DB; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1016; --surface:#171A23; --fg:#ECEEF3; --muted:#8F99AB; --line:#2A3040;
  --p1:#CF2F25; --p2:#2F66DB; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--body); font-size:16px; line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px 56px;
}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,7vw,4rem);line-height:.92;text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.stats{display:flex;gap:20px;font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{display:block;font-family:var(--display);font-size:2rem;line-height:1;font-weight:800;color:var(--fg);letter-spacing:.01em}




.ninp{width:100%;min-width:0;font:inherit;font-weight:600;padding:8px 10px;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:0}
.ninp:focus-visible{outline:3px solid var(--fg);outline-offset:2px;border-color:var(--fg)}
.ninp:disabled{opacity:.45;cursor:not-allowed}
.names{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.names .ninp{padding:6px 6px;font-size:.78rem}
.csel{font:inherit;font-size:.78rem;font-weight:600;padding:3px 6px;max-width:92%;background:var(--bg);color:var(--fg);border:0;border-radius:0}
.csel:focus-visible,.cb:focus-visible{outline:3px solid #fff;outline-offset:2px}
.cseg{display:flex;align-items:stretch;min-height:38px;gap:0;border:2px solid currentColor;width:100%;max-width:100%;min-width:0}
.cb{flex:1 1 0;min-width:0;border:0;background:transparent;color:inherit;font-family:var(--mono);font-size:.64rem;letter-spacing:.02em;text-transform:uppercase;padding:5px 3px;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center}
.tile.cat .cb{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.02em;padding:4px 2px;line-height:1.05}
.cstack{display:flex;flex-direction:column;gap:4px;width:100%}
.cstack .cseg{min-height:26px}
.cb + .cb{border-left:2px solid currentColor}
.cb.on{background:var(--on-p);color:var(--p1)}
.tile.cat:not(:has(input:checked)) .cb.on{background:var(--fg);color:var(--bg)}
/* Kr4ymes Quiz */
.sel{width:100%;appearance:auto;font:inherit;font-weight:600;padding:9px 10px;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:0}
.sel:focus-visible{outline:3px solid var(--fg);outline-offset:2px;border-color:var(--fg)}
.prow2{display:grid;grid-template-columns:9rem 1fr;align-items:center;gap:12px}
.prow2 .pn{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;min-width:6.5rem}
.lvls{display:flex;flex-direction:column;gap:6px}
.lvls .tile{padding:10px 4px}
.lvls .tt{font-size:.82rem;letter-spacing:0}
.seg.c5{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.seg.c5 .tile{padding:10px 2px}
.seg.c5 .tt{font-size:.74rem;letter-spacing:0;overflow-wrap:anywhere}
.qbig{font-family:var(--display);font-weight:900;font-size:3.2rem;line-height:1;text-align:center}
.qbig small{display:block;font-family:var(--mono);font-weight:400;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.rng{width:100%;accent-color:var(--p1);height:28px}
.rngends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.recap{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.recap li{display:flex;justify-content:space-between;gap:16px;padding:10px 14px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.recap li b{font-family:var(--display);font-weight:800;letter-spacing:.05em;text-transform:uppercase}

/* Hub giochi */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.gcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;min-height:clamp(240px,42vh,380px);padding:28px 24px;border:0;color:var(--on-p);cursor:pointer;clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px));transition:transform .18s,filter .18s}
.gcard:hover{transform:translateY(-4px);filter:brightness(1.1)}
.gcard.l{background:var(--p2)}
.gcard.r{background:var(--p1)}
.gcard .gt{font-family:var(--display);font-weight:900;font-size:clamp(2rem,4vw,3rem);line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.gcard .gd{font-size:1rem;opacity:.9;max-width:26ch}
.gcard .gtag{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;border:2px solid currentColor;padding:4px 12px;margin-top:6px}
.gcard .gnum{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.75rem;letter-spacing:.2em;opacity:.8}
.go .row .btn.back{justify-self:start}
@media (max-width:760px){ .hub{grid-template-columns:1fr}
  .cseg{flex-direction:column}
  .cb + .cb{border-left:0;border-top:2px solid currentColor}
  .cb{padding:5px 3px}
}

/* Home */
body:has(.home) .top{display:none}
body:has(.home){padding-block:14px 14px}
body:has(.home){margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
body:has(.home) .wrap{max-width:1040px;width:100%}
.home{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:22px;width:100%}
.hero .slab{height:30px;transform:skewX(-24deg)}
.hero .slab.l{background:var(--p2)}
.hero .slab.r{background:var(--p1)}
.hero h1{text-align:center;font-size:clamp(1.8rem,4.4vw,3.3rem);line-height:.9;margin:0;white-space:nowrap}
.hero .sub{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--mono);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:-4px}
.hero .sub i{width:8px;height:8px;background:var(--fg);transform:rotate(45deg)}
.panels{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.5fr);gap:20px;width:100%;align-items:stretch}
.panel{display:flex;flex-direction:column;gap:12px;padding:0 0 16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.panel .ph{margin:0;padding:8px 18px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:.14em;text-transform:uppercase;color:var(--on-p)}
.panel.pl .ph{background:var(--p2)}
.panel.pr .ph{background:var(--p1)}
.panel.pl .pb{justify-content:space-evenly}
.panel .pb{display:flex;flex-direction:column;gap:10px;padding:0 18px;flex:1;min-height:0}
.lab{margin:6px 0 0;text-align:center;font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;gap:8px}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.c4 .tile{padding:10px 3px}
.seg.c4 .cap{font-size:.56rem;letter-spacing:0;max-width:100%;overflow:hidden}
.seg.c1{grid-template-columns:minmax(0,1fr)}
.tile.chat{flex-direction:row;gap:10px;padding:7px 10px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.tile.chat .tt{font-size:.85rem}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:10px 8px;cursor:pointer;background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:background .15s,color .15s}
.tile input{position:absolute;opacity:0;pointer-events:none;inset:0}
.tile:hover{color:var(--fg)}
.tile:has(input:focus-visible){outline:3px solid var(--fg);outline-offset:-4px}
.tile.dis{opacity:.38;cursor:not-allowed}
.tile .big{font-family:var(--display);font-weight:900;font-size:2.2rem;line-height:1}
.tile .cap{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.tile .tt{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.pl .tile:has(input:checked){background:var(--p2);color:var(--on-p);box-shadow:none}
.pr .tile:has(input:checked){background:var(--p1);color:var(--on-p);box-shadow:none}
.hint2{margin:0;min-height:1.5em;text-align:center;font-size:.88rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:auto;gap:8px;flex:1}
.tile.cat{gap:3px;padding:6px 8px}
@media (max-height:760px){ .tile.cat{padding:3px 8px;gap:1px} .cats{gap:6px} .home{gap:10px} .cseg{min-height:32px} .panel{gap:8px} .panel .pb{gap:6px} }
.tile.cat .num{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;opacity:.8}
.tile.cat .tt{font-size:.98rem;letter-spacing:0}
.tile.cat .ds.nods{display:none}
.tile.cat .ds{font-size:.78rem;line-height:1.25;opacity:.85;text-transform:none}
.tile.cat .ct{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;opacity:.8}
.tile.cat .ck{position:absolute;top:7px;right:16px;width:16px;height:16px;border:2px solid currentColor;opacity:.6}
.tile.cat:has(input:checked) .ck{background:var(--on-p);opacity:1;border-color:var(--on-p)}
.tile.cat:has(input:checked) .ck::after{content:'';position:absolute;left:3px;top:0;width:4px;height:8px;border:solid var(--p1);border-width:0 2px 2px 0;transform:rotate(45deg)}
.go{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.go .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;width:100%}
.go .row i{height:2px;background:var(--line)}
.go .btn.primary{font-size:1.7rem;padding:9px 56px;letter-spacing:.14em}
@media (max-width:760px){
  .panels{grid-template-columns:1fr}
  .hero{gap:12px}
  .hero .slab{height:18px}
}

/* Setup */
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.setup p.lead{font-size:1.1rem;max-width:34ch;margin:0 0 12px}
.setup p.small{color:var(--muted);font-size:.9rem;max-width:44ch;margin:0}
.groups{display:flex;flex-direction:column;gap:10px;min-width:0}
.group{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.group input{width:22px;height:22px;accent-color:var(--fg);flex:none}
.group span.name{font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;line-height:1;flex:1;min-width:0}
.group span.n{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.startrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:6px}
.btn{background:transparent;border:2px solid var(--fg);padding:10px 18px;font-weight:600;letter-spacing:.02em}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn.primary{background:var(--fg);color:var(--bg);font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;padding:10px 28px;letter-spacing:.04em}
.btn.primary:hover{opacity:.88}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.armed{background:var(--p1);border-color:var(--p1);color:var(--on-p)}
.btn.both{border-color:var(--fg)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{border-color:var(--fg);color:var(--bg)}

/* Play */
.status{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.status .round{font-family:var(--display);font-weight:800;font-size:1.6rem;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.status .meta{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bye{font-size:.9rem;color:var(--muted);margin:-8px 0 0}
.bar{height:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);width:0;transition:width .3s}

.duel{display:grid;grid-template-columns:1fr 1fr;isolation:isolate;position:relative}
.card{
  position:relative;border:0;text-align:left;color:var(--on-p);
  min-height:clamp(380px,56vh,480px);padding:24px 28px 20px;
  display:flex;flex-direction:column;justify-content:space-between;gap:20px;overflow:hidden;
  transition:transform .18s,opacity .25s,filter .25s;
}
.card.c0{background:var(--p2);clip-path:polygon(0 0,100% 0,calc(100% - var(--cut)) 100%,0 100%);padding-right:calc(var(--cut) + 28px)}
.card.c1{background:var(--p1);clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%);margin-left:calc(var(--cut) * -1 + 10px);padding-left:calc(var(--cut) + 28px);text-align:right;align-items:flex-end}
.card:hover{transform:translateY(-4px)}
.card:focus-visible{outline:4px solid #fff;outline-offset:-10px}
.card .tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.card .ghost{position:absolute;bottom:-28px;font-family:var(--display);font-weight:900;font-size:13rem;line-height:1;opacity:.14;pointer-events:none}
.card.c0 .ghost{left:14px}
.card.c1 .ghost{right:14px}
.card .name{position:relative;margin-top:auto}
.card .main{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(1.7rem,4vw,3.2rem);line-height:.92;letter-spacing:.01em;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.card .sub{display:block;margin-top:10px;font-size:1.05rem;font-weight:500;opacity:.92;overflow-wrap:anywhere}
.card .hint{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;opacity:.8;position:relative}
.card.won{transform:scale(1.02);filter:brightness(1.12)}
.card.lost{opacity:.25;filter:grayscale(1)}
.vs{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  width:76px;height:76px;display:grid;place-items:center;
  background:var(--bg);color:var(--fg);border:3px solid var(--fg);
  font-family:var(--display);font-weight:900;font-size:2.1rem;transform-origin:center;rotate:45deg;
  translate:0 0;
}
.vs span{rotate:-45deg}
.vs{transform:translate(-50%,-50%) rotate(0)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.duel + .players,.outcome + .players{margin-top:14px}


/* Ritratti */
.portrait{position:absolute;top:calc(var(--pt,26px) + (100% - var(--pt,26px) - var(--pb,168px))*.08);height:calc((100% - var(--pt,26px) - var(--pb,168px))*.84);left:50%;transform:translateX(-50%);aspect-ratio:1/1;max-width:78%;border:3px solid rgba(255,255,255,.92);background:rgba(255,255,255,.16);overflow:hidden;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.portrait.tall{aspect-ratio:3/4}
.portrait.media{height:auto;width:74%;max-width:none;aspect-ratio:16/9;top:calc(var(--pt,26px) + (100% - var(--pt,26px) - var(--pb,168px))/2);transform:translate(-50%,-50%)}
.portrait.media .mono,.portrait.has .mono{display:none}
.card.c1 .portrait.media{width:calc(74% - (var(--cut) - 10px)*.74)}
.card.c0 .portrait{left:calc(50% - var(--cut)/4)}
.card.c1 .portrait{left:calc(50% + var(--cut)/4)}
.portrait .mono{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:4rem;color:#fff;opacity:.85;letter-spacing:.02em}
.portrait iframe,.portrait video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.portrait.tall img{object-position:top center}
.duel.compact .portrait{--pt:22px;--pb:120px}
.duel.compact .portrait .mono{font-size:2.4rem}

/* Due giocatori */
.vs{left:calc(50% - var(--cut) / 2 + 5px)}
.vs{rotate:none;transform:translate(-50%,-50%) rotate(45deg)}
.card.static{cursor:default}
.card.static:hover{transform:none}
.card .who{position:absolute;top:16px;z-index:2;font-family:var(--mono);font-size:.8rem;font-weight:500;letter-spacing:.08em;background:var(--bg);color:var(--fg);border:2px solid var(--fg);padding:2px 10px}
.card.c0 .who{right:calc(var(--cut) + 18px)}
.card.c1 .who{left:calc(var(--cut) + 18px)}
.outcome{margin:0;font-family:var(--mono);font-size:.9rem;padding:10px 14px;background:var(--surface);border:1px solid var(--line)}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.prow{border:1px solid var(--line);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.prow .pname{font-family:var(--display);font-weight:700;font-size:1.2rem;text-transform:uppercase;line-height:1.1}
.prow .pkeys{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.pbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.small{padding:6px 12px;font-size:.9rem}
.btn.small.r{background:var(--p1);border-color:var(--p1);color:var(--on-p)}
.btn.small.b{background:var(--p2);border-color:var(--p2);color:var(--on-p)}
.btn.small.r:hover,.btn.small.b:hover{opacity:.85;color:var(--on-p)}
.pbtns .ok{font-family:var(--mono);font-size:.82rem}
.modebox{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.modetitle{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.group.opt span.name{font-family:var(--body);font-weight:500;font-size:1rem;text-transform:none;line-height:1.3}
.splits{display:flex;flex-direction:column;gap:26px}
.splitblock{display:flex;flex-direction:column;gap:10px;min-width:0}
.splitblock .who2{font-family:var(--display);font-weight:700;font-size:1.2rem;text-transform:uppercase;line-height:1.1}
.nopass{margin:0;font-size:.95rem;color:var(--muted);padding:12px 14px;border:1px dashed var(--line)}
.duel.compact .card{min-height:270px}
.duel.compact .card .main{font-size:clamp(1.2rem,3vw,2rem)}
.duel.compact .card .ghost{font-size:6rem}
.duel.compact .vs{width:54px;height:54px;font-size:1.3rem}
.done2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:28px;align-items:start}
.col2{display:flex;flex-direction:column;gap:14px;min-width:0}

    var badges = [[],[]], cls = ['',''];
    if(revealing && pending){
      votes.forEach(function(v, pl){ if(v===0 || v===2) badges[0].push(gs(pl)); if(v===1 || v===2) badges[1].push(gs(pl)); });
      if(pending.res === 2){ cls = ['lost','lost']; } else { cls[pending.res] = 'won'; cls[1 - pending.res] = 'lost'; }
    }
    stage.appendChild(h('div', {class:'duel'}, [card2(0, p[0], badges[0], cls[0], 'card-'), card2(1, p[1], badges[1], cls[1], 'card-'), h('div', {class:'vs','aria-hidden':'true'}, [h('span', {text:'VS'})])]));
    if(revealing && pending) stage.appendChild(h('p', {class:'outcome', text:pending.text}));
    stage.appendChild(h('div', {class:'players'}, votes.map(function(_, pl){ return playerRow(pl); })));
    var undoBtn = h('button', {class:'btn ghost', type:'button', id:'btn-undo', text:'Annulla ultima scelta', onclick:undo});
    if(S.choices.length === 0 || revealing) undoBtn.disabled = true;
    stage.appendChild(h('div', {class:'controls'}, [
      undoBtn,
      guarded('reshuffle','Azzera','Perdi i progressi, confermi?', reshuffle, 'ghost'),
      guarded('reset','Home','Perdi i progressi, confermi?', toSetup, 'ghost')
    ]));
  }

  function ranking(R){
    var order = (R.champion !== null ? [R.champion] : []).concat(R.elim.slice().reverse().map(function(e){return e.id;}));
    var roundOf = {}; R.elim.forEach(function(e){ roundOf[e.id] = e.round; });
    return order.map(function(id,i){ return {id:id, pos:i+1, round:roundOf[id]}; });
  }
  function rankText(rows){ return rows.slice(0,10).map(function(r){ return r.pos + '. ' + GAMES[r.id].label; }).join('\n'); }

  function renderDone(stage, R){
    var rows = ranking(R), champ, firstRank;
    if(R.champion !== null){
      var t = parts(R.champion);
      champ = champBox(R.champion, [
        h('div', {class:'tag', text:'Vincitore su ' + S.ids.length + ' elementi'}),
        h('p', {class:'main', text:t[0]}),
        t[1] ? h('span', {class:'sub', text:t[1]}) : null
      ]);
      firstRank = 1;
    } else {
      champ = h('div', {class:'champ'}, [
        h('div', {class:'tag', text:'Su ' + S.ids.length + ' elementi'}),
        h('p', {class:'main', text:'Nessun vincitore'}),
        h('span', {class:'sub', text:'Gli ultimi due sono stati eliminati insieme.'})
      ]);
      firstRank = 0;
    }
    var top = h('ol');
    rows.slice(firstRank, firstRank + 9).forEach(function(r){
      var tt = GAMES[r.id].label;
      top.appendChild(h('li', null, [h('span',{class:'pos', text:String(r.pos)}), h('span',{class:'t'}, [tt, h('span',{class:'r', text: (R.champion !== null && r.pos===2) ? 'Finalista' : 'Eliminato al turno ' + r.round})])]));
    });
    var rank = h('div', {class:'rank'}, [h('h2', {text:'Podio e dintorni'}), top]);
    var msgEl = h('span', {class:'msg', id:'msg', text:msg});
    stage.appendChild(h('div', {class:'done'}, [champ, rank]));
    if(S.mode === 3 && S.vlog.length){
      var agree3 = S.vlog.filter(function(v){ return v.every(function(x){ return x === v[0]; }); }).length;
      stage.appendChild(h('p', {class:'outcome', text:'Siete andati d’accordo in ' + agree3 + ' duelli su ' + S.vlog.length + ' (' + Math.round(agree3 / S.vlog.length * 100) + '%).'}));
    }
    stage.appendChild(h('div', {class:'controls'}, [
      h('button', {class:'btn primary', type:'button', id:'btn-again', text:'Rigioca', onclick:reshuffle}),
      h('button', {class:'btn', type:'button', id:'btn-back', text:'Cambia selezione', onclick:toSetup}),
      h('button', {class:'btn ghost', type:'button', id:'btn-undo2', text:'Annulla ultima scelta', onclick:undo}),
      msgEl
    ]));
  }

  function renderLists(R){
    var box = document.getElementById('lists'); box.textContent = '';
    if(S.phase!=='play') return;
    if(R.done){
      var rows = ranking(R);
      var ul = h('ul', {class:'chips'});
      rows.forEach(function(r){ ul.appendChild(h('li', null, [r.pos + '. ' + GAMES[r.id].label])); });
      box.appendChild(h('details', null, [h('summary', {text:'Classifica completa (' + rows.length + ')'}), ul]));
      return;
    }
    var gone = h('ul', {class:'chips'});
    R.elim.slice().reverse().forEach(function(e){ gone.appendChild(h('li', null, [GAMES[e.id].label, h('small',{text:'T'+e.round})])); });
    box.appendChild(h('details', null, [h('summary', {text:'Eliminati (' + R.elim.length + ')'}), R.elim.length ? gone : h('p',{class:'msg', style:'padding:0 16px 14px', text:'Ancora nessuno.'})]));
  }

  function render(){
    var stage = document.getElementById('stage'); stage.textContent = '';
    if(screen){
      document.getElementById('lists').textContent = '';
      if(screen === 'quiz') renderQuizSoon(stage); else if(screen === 'quizgo') renderQuizGo(stage); else renderHub(stage);
      return;
    }
    var R = null, two = S.mode === 2;
    if(S.phase === 'play'){ R = two ? replay2(S.ids, S.seed, S.vlog) : replay(S.ids, S.seed, S.choices); }
    renderStats(R);
    if(S.phase === 'setup') renderSetup(stage);
    else if(two){ if(R.done) renderDone2(stage, R); else renderPlay2(stage, R); }
    else if(R.done) renderDone(stage, R);
    else if(S.mode === 3) renderPlay3(stage, R);
    else renderPlay(stage, R);
    if(S.phase === 'play' && two) renderLists2(R); else renderLists(R);
    hydrate(); prefetchNext(R);
  }

  load();
  if(S.phase === 'setup') screen = 'hub';
  votes = nullVotes();
  render();
})();
</script>
